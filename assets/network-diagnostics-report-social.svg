<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Network Diagnostics Suite technical report</title>
  <desc id="description">Editorial social card for Johnny Li's Network Diagnostics Suite technical report.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#171714" opacity="0.08"/>
    </pattern>
    <radialGradient id="warm-light" cx="82%" cy="15%" r="68%">
      <stop offset="0" stop-color="#c98c70" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#b8664d" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#f2efe8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#f2efe8"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#warm-light)"/>
  <line x1="72" y1="76" x2="1128" y2="76" stroke="#b8664d" stroke-width="3"/>
  <text x="72" y="142" fill="#a9553d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="3">TECHNICAL REPORT / REVISION 1</text>
  <text x="72" y="248" fill="#171714" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="500" letter-spacing="-3">From browser speed test to</text>
  <text x="72" y="330" fill="#9f4f38" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-style="italic" letter-spacing="-3">cross-platform diagnostics.</text>
  <text x="72" y="414" fill="#625e57" font-family="Inter, Arial, sans-serif" font-size="27">Measurement methodology · M-Lab benchmark · R2 delivery</text>
  <text x="72" y="454" fill="#625e57" font-family="Inter, Arial, sans-serif" font-size="27">Native architecture · Schema 2.0 · Privacy and validation</text>
  <line x1="72" y1="518" x2="1128" y2="518" stroke="#171714" stroke-opacity="0.22"/>
  <text x="72" y="566" fill="#171714" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Johnny Li</text>
  <text x="1128" y="566" fill="#625e57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="end">johnnyli.dev</text>
</svg>
