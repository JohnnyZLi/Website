name: Apply compact Portfolio header experiment

on:
  push:
    branches:
      - ui/compact-header-utility-cluster

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/compact-header-utility-cluster
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Sync latest shared design system
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run design-system:update
          npm install --no-audit --no-fund --no-package-lock
          npm run design-system:sync
      - name: Apply Portfolio compact expression
        run: |
          python3 .github/scripts/apply-portfolio-compact-header.py
          python3 .github/scripts/patch-compact-header-conformance.py
          npm run design-system:integration
          npm run design-system:conformance
          npm run lint:html
          npm run lint:css
      - name: Commit non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-portfolio-compact-header.py .github/scripts/patch-compact-header-conformance.py
          git restore -- .github/workflows/visual-audit.yml
          git add design-system.lock.json design-system.conformance.json package.json assets/design-system index.html projects site-switcher.js portfolio-navigation.js scripts/validate-design-system-integration.mjs
          git commit -m "Use compact shared utility header"
          git push origin HEAD:ui/compact-header-utility-cluster
