name: Fix report grid mobile cascade

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/report-open-grids' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/report-open-grids
      - name: Override desktop dividers in stacked layout
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path('technical-report.css')
          css = css_path.read_text()
          old = '''  .report-grid article {
            padding: 25px 0 28px;
            border-top: 0;
            border-right: 0;
          }

          .report-grid article + article {
            border-top: 1px solid var(--rule);
          }
          '''.replace('          ', '')
          new = '''  .report-grid article {
            padding: 25px 0 28px;
            border-top: 0;
          }

          .report-grid article:nth-child(odd) {
            border-right: 0;
          }

          .report-grid article:nth-child(n + 3) {
            border-top: 0;
          }

          .report-grid article:nth-child(n + 2) {
            border-top: 1px solid var(--rule);
          }
          '''.replace('          ', '')
          if old not in css:
              raise SystemExit('Compact report-grid cascade block did not match')
          css_path.write_text(css.replace(old, new))

          validator_path = Path('scripts/validate-technical-report.mjs')
          validator = validator_path.read_text()
          old_fragment = '  ".report-grid article + article",'
          new_fragment = '  ".report-grid article:nth-child(n + 2)",'
          if old_fragment not in validator:
              raise SystemExit('Open-grid validator fragment did not match')
          validator_path.write_text(validator.replace(old_fragment, new_fragment))
          PY
          rm .github/workflows/fix-report-grid-mobile-cascade.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add technical-report.css scripts/validate-technical-report.mjs .github/workflows/fix-report-grid-mobile-cascade.yml
          git commit -m "Fix stacked report grid dividers"
          git push origin HEAD:fix/report-open-grids
