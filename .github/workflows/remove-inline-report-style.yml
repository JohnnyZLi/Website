name: Remove report runtime style exception

on:
  push:
    branches: ["feat/shared-dark-mode"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-dark-mode
      - name: Remove redundant inline progress style
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('technical-report.js')
          text = path.read_text()
          needle = "        if (activeIndex >= 0) progressFill.style.setProperty('--report-progress', progressValue);\n"
          if needle not in text:
              raise SystemExit('redundant inline progress style not found')
          path.write_text(text.replace(needle, '', 1))
          PY
          rm .github/workflows/remove-inline-report-style.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove redundant report inline style"
          git push origin HEAD:feat/shared-dark-mode
