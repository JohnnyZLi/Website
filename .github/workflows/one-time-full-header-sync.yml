name: One-time full-header design-system sync

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-full-header-sync.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve and install latest reviewed design system
        run: |
          npm install --no-audit --no-fund
          npm run design-system:update
          npm install --no-audit --no-fund
      - name: Synchronize generated assets
        run: npm run design-system:sync
      - name: Validate synchronized Portfolio
        run: |
          npm run design-system:check
          npm run design-system:integration
          npm run design-system:conformance
          npm run lint:html
          npm run lint:css
      - name: Open synchronized update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm .github/workflows/one-time-full-header-sync.yml
          branch=automation/full-header-design-system-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add design-system.lock.json package.json package-lock.json assets/design-system index.html projects site-switcher.js portfolio-navigation.js .github/workflows/one-time-full-header-sync.yml
          git commit -m "Sync full-header disclosure behavior"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${branch}"
          body="Synchronizes Web Design System 419606579129675acdc5df1437ebe55e8f8ad47e so the complete top bar stays together while Sites or Settings is open. Removes this one-time sync workflow in the same update."
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "Sync full-header disclosure behavior" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Sync full-header disclosure behavior" --body "$body"
          fi
