name: Add report grid regression coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/report-open-grids' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/report-open-grids
      - name: Add open-grid assertions
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path('technical-report.css')
          css = css_path.read_text()
          malformed = "  .report-grid article {\n  padding: 25px 0 28px;\n  border-top: 0;\n  border-right: 0;\n}\n\n.report-grid article + article {\n  border-top: 1px solid var(--rule);\n}"
          formatted = "  .report-grid article {\n    padding: 25px 0 28px;\n    border-top: 0;\n    border-right: 0;\n  }\n\n  .report-grid article + article {\n    border-top: 1px solid var(--rule);\n  }"
          if malformed not in css:
              raise SystemExit('Compact report-grid formatting block did not match')
          css_path.write_text(css.replace(malformed, formatted))

          audit_path = Path('scripts/technical-report-visual-audit.mjs')
          audit = audit_path.read_text()
          setup_old = '      const timeline = document.querySelector(".report-timeline article");\n      const root = getComputedStyle(document.documentElement);'
          setup_new = '''      const timeline = document.querySelector(".report-timeline article");
          const reportGrids = [...document.querySelectorAll(".report-grid")].map((grid) => {
            const gridStyle = getComputedStyle(grid);
            const items = [...grid.querySelectorAll(":scope > article")].map((item) => {
              const itemStyle = getComputedStyle(item);
              return {
                borderTop: Number.parseFloat(itemStyle.borderTopWidth),
                borderRight: Number.parseFloat(itemStyle.borderRightWidth),
                borderBottom: Number.parseFloat(itemStyle.borderBottomWidth),
                borderLeft: Number.parseFloat(itemStyle.borderLeftWidth),
              };
            });
            return {
              borderTop: Number.parseFloat(gridStyle.borderTopWidth),
              borderRight: Number.parseFloat(gridStyle.borderRightWidth),
              borderBottom: Number.parseFloat(gridStyle.borderBottomWidth),
              borderLeft: Number.parseFloat(gridStyle.borderLeftWidth),
              items,
            };
          });
          const root = getComputedStyle(document.documentElement);'''.replace('          ', '      ')
          if setup_old not in audit:
              raise SystemExit('Visual audit grid setup anchor did not match')
          audit = audit.replace(setup_old, setup_new)

          metrics_old = '        timelineDisplay: timeline ? getComputedStyle(timeline).display : null,\n        actionLabels:'
          metrics_new = '        timelineDisplay: timeline ? getComputedStyle(timeline).display : null,\n        reportGrids,\n        actionLabels:'
          if metrics_old not in audit:
              raise SystemExit('Visual audit grid metrics anchor did not match')
          audit = audit.replace(metrics_old, metrics_new)

          problems_old = '    if (metrics.timelineDisplay !== expectedTimeline) problems.push(`timeline display is ${metrics.timelineDisplay}, expected ${expectedTimeline}`);\n    if (metrics.inlineStyles !== 0) problems.push("inline style attributes remain");'
          problems_new = '''    if (metrics.timelineDisplay !== expectedTimeline) problems.push(`timeline display is ${metrics.timelineDisplay}, expected ${expectedTimeline}`);
          for (const [gridIndex, grid] of metrics.reportGrids.entries()) {
            if (grid.items.length !== 4) problems.push(`report grid ${gridIndex + 1} has ${grid.items.length} items, expected 4`);
            if (grid.borderTop !== 0 || grid.borderRight !== 0 || grid.borderBottom !== 0 || grid.borderLeft !== 0) problems.push(`report grid ${gridIndex + 1} has an outer container border`);
            const [first, second, third, fourth] = grid.items;
            if (!first || !second || !third || !fourth) continue;
            if (viewport.width > 600) {
              if (first.borderTop !== 0 || first.borderBottom !== 0 || first.borderLeft !== 0 || first.borderRight < 1) problems.push(`report grid ${gridIndex + 1} first cell does not expose only the internal column divider`);
              if (second.borderTop !== 0 || second.borderRight !== 0 || second.borderBottom !== 0 || second.borderLeft !== 0) problems.push(`report grid ${gridIndex + 1} second cell has an outer border`);
              if (third.borderTop < 1 || third.borderRight < 1 || third.borderBottom !== 0 || third.borderLeft !== 0) problems.push(`report grid ${gridIndex + 1} third cell does not expose only internal dividers`);
              if (fourth.borderTop < 1 || fourth.borderRight !== 0 || fourth.borderBottom !== 0 || fourth.borderLeft !== 0) problems.push(`report grid ${gridIndex + 1} fourth cell has an outer border`);
            } else {
              if (first.borderTop !== 0 || first.borderRight !== 0 || first.borderBottom !== 0 || first.borderLeft !== 0) problems.push(`report grid ${gridIndex + 1} first stacked cell has an outer border`);
              for (const [itemIndex, item] of grid.items.slice(1).entries()) {
                if (item.borderTop < 1 || item.borderRight !== 0 || item.borderBottom !== 0 || item.borderLeft !== 0) problems.push(`report grid ${gridIndex + 1} stacked cell ${itemIndex + 2} does not use only an internal top divider`);
              }
            }
          }
          if (metrics.inlineStyles !== 0) problems.push("inline style attributes remain");'''.replace('          ', '    ')
          if problems_old not in audit:
              raise SystemExit('Visual audit grid problem anchor did not match')
          audit_path.write_text(audit.replace(problems_old, problems_new))

          validator_path = Path('scripts/validate-technical-report.mjs')
          validator = validator_path.read_text()
          required_old = '  ".bar-fill-worker",\n  "@media (max-width: 900px)",'
          required_new = '  ".bar-fill-worker",\n  ".report-grid article:nth-child(n + 3)",\n  ".report-grid article + article",\n  "@media (max-width: 900px)",'
          if required_old not in validator:
              raise SystemExit('Validator open-grid fragment anchor did not match')
          validator = validator.replace(required_old, required_new)

          check_old = 'if (styles.includes("backdrop-filter")) fail("Technical report stylesheet re-owns the shared header surface.");'
          check_new = '''if (styles.includes("backdrop-filter")) fail("Technical report stylesheet re-owns the shared header surface.");

          const reportGridBlock = styles.match(/\\.report-grid \\{([^}]*)\\}/)?.[1] ?? "";
          if (/border(?:-top|-right|-bottom|-left)?\\s*:/.test(reportGridBlock)) fail("Report grids must not draw an outer container border.");
          const reportGridItemBlock = styles.match(/\\.report-grid article \\{([^}]*)\\}/)?.[1] ?? "";
          if (/border-bottom\\s*:/.test(reportGridItemBlock)) fail("Report grid cells must not create a bottom outer border.");'''.replace('          ', '')
          if check_old not in validator:
              raise SystemExit('Validator open-grid check anchor did not match')
          validator_path.write_text(validator.replace(check_old, check_new))
          PY
          rm .github/workflows/add-report-grid-regression.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add technical-report.css scripts/technical-report-visual-audit.mjs scripts/validate-technical-report.mjs .github/workflows/add-report-grid-regression.yml
          git commit -m "Guard open report grid treatment"
          git push origin HEAD:fix/report-open-grids
