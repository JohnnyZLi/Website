name: Sync WDS ef266b9

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-wds-ef266b9.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'chore/sync-wds-ef266b9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Pin and sync shared design system
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sha = 'ef266b98576ead45abdfc4a02ddd00e88dfc47f3';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@johnnyzli/web-design-system'] = `github:JohnnyZLi/Web-Design-System#${sha}`;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          const lock = JSON.parse(fs.readFileSync('design-system.lock.json', 'utf8'));
          lock.sourceCommit = sha;
          fs.writeFileSync('design-system.lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          npm install --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:integration
          rm .github/workflows/sync-wds-ef266b9.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json design-system.lock.json assets/design-system index.html projects site-switcher.js portfolio-navigation.js .github/workflows/sync-wds-ef266b9.yml
          git commit -m "Sync slower shared header dismissal"
          git push origin HEAD:${{ github.head_ref }}
