name: Apply design-system cache-key fix

on:
  push:
    branches:
      - fix/design-system-cache-key
    paths:
      - .github/workflows/apply-design-system-cache-key-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/design-system-cache-key

      - name: Update integration contract for commit-keyed assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate-design-system-integration.mjs")
          text = path.read_text()

          replacements = {
              'const expectedSiteSwitcherEntry = `<script type="module" src="site-switcher.js?v=${expectedVersion}"></script>`;':
                  'const expectedSiteSwitcherEntry = `<script type="module" src="site-switcher.js?v=${expectedCommit}"></script>`;',
              "const requiredStyles = [\n  \"assets/design-system/tokens.css\",\n  \"assets/design-system/foundations.css\",\n  \"assets/design-system/site-identity.css\",\n  \"assets/design-system/theme-control.css\",\n  \"styles.css\",\n  \"knowledge.css\",\n  \"terracotta-accent.css\",\n  \"design-system-migration.css\",\n];\nlet previousPosition = -1;\nfor (const stylesheet of requiredStyles) {\n  const position = index.indexOf(`href=\"${stylesheet}\"`);\n  if (position < 0) fail(`Missing stylesheet ${stylesheet}.`);\n  if (position <= previousPosition) fail(`Stylesheet order is incorrect at ${stylesheet}.`);\n  previousPosition = position;\n}":
                  "const sharedStyles = [\n  \"assets/design-system/tokens.css\",\n  \"assets/design-system/foundations.css\",\n  \"assets/design-system/site-identity.css\",\n  \"assets/design-system/theme-control.css\",\n];\nconst productStyles = [\n  \"styles.css\",\n  \"knowledge.css\",\n  \"terracotta-accent.css\",\n  \"design-system-migration.css\",\n];\nlet previousPosition = -1;\nfor (const stylesheet of [...sharedStyles, ...productStyles]) {\n  const href = sharedStyles.includes(stylesheet) ? `${stylesheet}?v=${expectedCommit}` : stylesheet;\n  const position = index.indexOf(`href=\"${href}\"`);\n  if (position < 0) fail(`Missing stylesheet ${href}.`);\n  if (position <= previousPosition) fail(`Stylesheet order is incorrect at ${href}.`);\n  previousPosition = position;\n}",
              "'<script src=\"assets/design-system/theme-bootstrap.js\"></script>'":
                  '`<script src="assets/design-system/theme-bootstrap.js?v=${expectedCommit}"></script>`',
              "'href=\"assets/design-system/theme-control.css\"'":
                  '`href="assets/design-system/theme-control.css?v=${expectedCommit}"`',
              "'import { installSiteSwitcher } from \"./assets/design-system/site-controls.js\"'":
                  '`await import("./assets/design-system/site-controls.js?v=${expectedCommit}")`',
              "'import { installHeaderMenu } from \"./assets/design-system/site-controls.js\"'":
                  '`await import("./assets/design-system/site-controls.js?v=${expectedCommit}")`',
              "'href=\"../assets/design-system/tokens.css\"'":
                  '`href="../assets/design-system/tokens.css?v=${expectedCommit}"`',
              "'href=\"../assets/design-system/foundations.css\"'":
                  '`href="../assets/design-system/foundations.css?v=${expectedCommit}"`',
              "'href=\"../assets/design-system/site-identity.css\"'":
                  '`href="../assets/design-system/site-identity.css?v=${expectedCommit}"`',
              "'href=\"../assets/design-system/theme-control.css\"'":
                  '`href="../assets/design-system/theme-control.css?v=${expectedCommit}"`',
              "'<script src=\"../assets/design-system/theme-bootstrap.js\"></script>'":
                  '`<script src="../assets/design-system/theme-bootstrap.js?v=${expectedCommit}"></script>`',
              "'<script type=\"module\" src=\"../site-switcher.js\"></script>'":
                  '`<script type="module" src="../site-switcher.js?v=${expectedCommit}"></script>`',
              "'<script type=\"module\" src=\"../portfolio-navigation.js\"></script>'":
                  '`<script type="module" src="../portfolio-navigation.js?v=${expectedCommit}"></script>`',
              "  'assets/design-system', \"dependency.endsWith(`#${sourceCommit}`)\",\n], \"Design-system synchronizer\");":
                  "  'assets/design-system', \"dependency.endsWith(`#${sourceCommit}`)\", \"collectHtml\", \"versionReference\",\n  'site-switcher.js', 'portfolio-navigation.js',\n], \"Design-system synchronizer\");",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Integration contract pattern missing: {old[:100]}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Install dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Regenerate shared assets and commit-keyed entry points
        run: npm run design-system:sync

      - name: Validate regenerated state
        run: |
          npm run design-system:integration
          npm run lint

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-design-system-cache-key-fix.yml

      - name: Commit regenerated entry points
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate commit-keyed design-system entry points"
          npm run design-system:check
          git push origin HEAD:fix/design-system-cache-key
