name: Generate versioned Sites entry

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Create correction branch
        run: git checkout -b fix/versioned-sites-controller-entry

      - name: Version the outer Sites controller on every route
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = "1.9.0"
          html_files = [Path("index.html"), *sorted(Path("projects").rglob("*.html"))]
          changed = []

          for path in html_files:
              text = path.read_text()
              updated = text.replace(
                  'site-switcher.js"></script>',
                  f'site-switcher.js?v={version}"></script>',
              )
              updated = updated.replace(
                  "Automation &amp development",
                  "Automation &amp; development",
              )
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          validator = Path("scripts/validate-design-system-integration.mjs")
          text = validator.read_text()
          updated = text.replace(
              'site-switcher.js"></script>',
              f'site-switcher.js?v={version}"></script>',
          )
          if updated != text:
              validator.write_text(updated)
              changed.append(str(validator))

          if not changed:
              raise SystemExit("No Sites entry corrections were required.")

          print("Updated:")
          print("\n".join(changed))
          PY

          rm -f _headers
          rm -f .github/workflows/generate-versioned-sites-entry.yml

      - name: Commit generated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version Sites controller for GitHub Pages"
          git push --set-upstream origin fix/versioned-sites-controller-entry

      - name: Open correction pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head fix/versioned-sites-controller-entry \
            --title "Version the Sites controller for GitHub Pages" \
            --body "Versions the outer site-switcher module URL on every portfolio route, updates the integration contract, removes the ineffective Cloudflare Pages headers file, normalizes the homepage entity, and removes this one-time generator. The normal merge commit will force GitHub Pages to publish the corrected entry points."
