name: Technical report audit

on:
  pull_request:
    paths:
      - "projects/network-diagnostics-suite/report/**"
      - "technical-report.css"
      - "technical-report.js"
      - "project-actions.css"
      - "scripts/validate-technical-report.mjs"
      - "scripts/technical-report-visual-audit.mjs"
      - "scripts/technical-report-visual-baseline.json"
      - ".github/workflows/technical-report-audit.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - run: npm run lint
      - run: node scripts/validate-technical-report.mjs
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-report-server.log 2>&1 &
          echo $! > /tmp/portfolio-report-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-report-server.log
          exit 1
      - run: node scripts/technical-report-visual-audit.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: technical-report-visual-audit
          path: technical-report-visual-audit
          retention-days: 7
