name: Technical report audit

on:
  pull_request:
    paths:
      - ".github/workflows/technical-report-audit.yml"
      - "scripts/technical-report-visual-baseline.json"

permissions:
  contents: write

jobs:
  consolidate-toc-selectors:
    if: github.event.pull_request.head.ref == 'feat/technical-report-scrollspy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/technical-report-scrollspy
          fetch-depth: 0
      - name: Consolidate CSS selectors
        run: |
          git fetch origin main
          python3 <<'PY'
          from pathlib import Path

          path = Path('technical-report.css')
          css = path.read_text()
          css = css.replace(
              '''.report-toc li {
  counter-increment: toc;
  border-top: 1px solid var(--rule);
}''',
              '''.report-toc li {
  position: relative;
  counter-increment: toc;
  border-top: 1px solid var(--rule);
}''',
              1,
          )
          css = css.replace(
              '''.report-toc a {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  padding: 12px 0;
  color: var(--muted);
  font-size: 0.76rem;
  line-height: 1.4;
}''',
              '''.report-toc a {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  padding: 12px 0;
  color: var(--muted);
  font-size: 0.76rem;
  line-height: 1.4;
  transition: color 160ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}''',
              1,
          )
          css = css.replace(
              '''.report-toc li {
  position: relative;
}

.report-toc a {
  transition: color 160ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

''',
              '',
              1,
          )
          path.write_text(css)
          PY
          git show origin/main:.github/workflows/technical-report-audit.yml > .github/workflows/technical-report-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/technical-report-audit.yml technical-report.css
          git commit -m "Consolidate report contents selectors"
          git push origin HEAD:feat/technical-report-scrollspy
