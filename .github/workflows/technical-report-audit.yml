name: Technical report audit

on:
  pull_request:
    paths:
      - ".github/workflows/technical-report-audit.yml"
      - ".github/workflows/apply-report-scrollspy.yml"
      - "technical-report.js"
      - "scripts/technical-report-visual-baseline.json"

permissions:
  contents: write

jobs:
  patch-scroll-navigation:
    if: github.event.pull_request.head.ref == 'feat/technical-report-scrollspy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/technical-report-scrollspy
          fetch-depth: 0
      - name: Apply deterministic report patch
        run: |
          git fetch origin main
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-report-scrollspy.yml').read_text()
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          if start not in workflow or end not in workflow:
              raise SystemExit('Scrollspy patch payload is missing')
          payload = workflow.split(start, 1)[1].split(end, 1)[0]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())
          exec(compile(payload, 'apply-report-scrollspy', 'exec'), {'__name__': '__main__'})
          PY
          git show origin/main:.github/workflows/technical-report-audit.yml > .github/workflows/technical-report-audit.yml
          rm .github/workflows/apply-report-scrollspy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/technical-report-audit.yml .github/workflows/apply-report-scrollspy.yml projects/network-diagnostics-suite/report/index.html technical-report.css scripts/technical-report-visual-audit.mjs scripts/validate-technical-report.mjs
          git commit -m "Add scroll-aware report contents"
          git push origin HEAD:feat/technical-report-scrollspy
