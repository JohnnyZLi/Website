name: Design system sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 16 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: JohnnyZLi/Web-Design-System/.github/workflows/consumer-design-system-sync.yml@82f97cb4072758991f8baf98d7e7bed052142136
    with:
      node-version: "24"
      timeout-minutes: 15
      install-command: npm install --no-audit --no-fund --no-package-lock
      validate-command: npm run design-system:integration && npm run design-system:conformance && npm run lint:html && npm run lint:css
      tracked-paths: |
        design-system.lock.json
        design-system.conformance.json
        package.json
        assets/design-system
        index.html
        projects/*.html
        site-switcher.js
        portfolio-navigation.js
      product-name: portfolio
