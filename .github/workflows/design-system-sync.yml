name: Design system sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 16 * * 1"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/design-system-sync.yml"
      - "design-system.lock.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: JohnnyZLi/Web-Design-System/.github/workflows/consumer-design-system-sync.yml@25ab8705a8f8311d212a923c166aac70410fbc3d
    with:
      node-version: "24"
      timeout-minutes: 15
      install-command: npm install --no-audit --no-fund --no-package-lock
      validate-command: npm run design-system:integration && npm run design-system:conformance && npm run lint:html && npm run lint:css
      package-json: package.json
      tracked-paths: |
        design-system.lock.json
        design-system.conformance.json
        package.json
        assets/design-system
        index.html
        projects/*.html
        site-switcher.js
        portfolio-navigation.js
      product-name: portfolio
