name: Apply live GitHub Pages theme cache fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-live-theme-cache-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Version the outer Sites controller on every route
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = "1.9.0"
          html_files = [Path("index.html"), *sorted(Path("projects").rglob("*.html"))]
          changed = []

          for path in html_files:
              text = path.read_text()
              updated = text.replace(
                  'site-switcher.js"></script>',
                  f'site-switcher.js?v={version}"></script>',
              )
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          validator = Path("scripts/validate-design-system-integration.mjs")
          text = validator.read_text()
          updated = text.replace(
              'site-switcher.js"></script>',
              f'site-switcher.js?v={version}"></script>',
          )
          if updated != text:
              validator.write_text(updated)
              changed.append(str(validator))

          if not changed:
              raise SystemExit("No unversioned Sites controller references were found.")

          print("Updated:")
          print("\n".join(changed))
          PY

          rm -f _headers
          rm -f .github/workflows/apply-live-theme-cache-fix.yml
          printf '%s\n' 'GitHub Pages theme cache fix applied.' > .github/theme-cache-fix-applied

      - name: Commit corrected deployment contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version Sites controller for GitHub Pages"
          git push origin HEAD:main
