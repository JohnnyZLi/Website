name: Fix report progress specificity

on:
  push:
    branches: ["feat/shared-dark-mode"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-dark-mode
      - name: Strengthen constructable stylesheet selectors
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('technical-report.js')
          text = path.read_text()
          replacements = {
              '          [data-report-toc-indicator] {': '          .report-toc-indicator[data-report-toc-indicator] {',
              '          [data-report-progress-fill] {': '          .report-progress-fill[data-report-progress-fill] {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing selector: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/fix-report-progress-specificity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix report progress stylesheet specificity"
          git push origin HEAD:feat/shared-dark-mode
