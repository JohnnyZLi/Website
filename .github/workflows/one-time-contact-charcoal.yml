name: One-time Contact charcoal update

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/contact-dark-match-light
          fetch-depth: 0
      - name: Match dark Contact to light charcoal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('design-system-migration.css')
          text = p.read_text()
          old = 'background: #1c1917;'
          new = 'background: #171714;'
          if old not in text:
              raise SystemExit('Expected dark Contact color not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-contact-charcoal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system-migration.css .github/workflows/one-time-contact-charcoal.yml
          git commit -m "Match dark Contact background to light theme"
          git push origin HEAD:agent/contact-dark-match-light
