name: Synchronize final theme runtime

on:
  push:
    branches: ["feat/shared-dark-mode"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-dark-mode
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Pin, synchronize, and correct report audit
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          old = '730fe5fc66de8321184ab7dae22c226a97d1aeb8'
          new = 'aca8bf9f4c5c2b93a123ac91ca804b4079ec64b9'

          package = Path('package.json')
          package.write_text(package.read_text().replace(old, new))

          lock_path = Path('design-system.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sourceCommit'] = new
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          source = Path('assets/design-system/SOURCE.md')
          source.write_text(source.read_text().replace(old, new))

          audit = Path('scripts/technical-report-visual-audit.mjs')
          text = audit.read_text()
          old_read = "progressWidth: progressFill?.style.getPropertyValue('--report-progress') ?? null,"
          new_read = "progressWidth: progressFill ? getComputedStyle(progressFill).getPropertyValue('--report-progress').trim() : null,"
          if old_read not in text:
              raise SystemExit('report progress audit read was not found')
          audit.write_text(text.replace(old_read, new_read, 1))
          PY
          npm install --no-audit --no-fund
          npm run design-system:sync
          rm .github/workflows/sync-final-theme.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize final validated theme runtime"
          git push origin HEAD:feat/shared-dark-mode
