name: Theme audit

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "site-switcher.js"
      - "assets/design-system/**"
      - "scripts/theme-visual-audit.mjs"
      - "scripts/sync-design-system.mjs"
      - "design-system.lock.json"
      - "design-system.conformance.json"
      - "package.json"
      - ".github/workflows/theme-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - run: npm run design-system:check
      - run: npm run lint
      - run: npm run design-system:integration
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-theme-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-theme-server.log
          exit 1
      - run: npm run theme:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portfolio-theme-audit
          path: theme-visual-audit
          retention-days: 7
