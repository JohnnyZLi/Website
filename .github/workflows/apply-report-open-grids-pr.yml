name: Apply report open grids on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/report-open-grids' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/report-open-grids
      - name: Remove outer report-grid borders
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('technical-report.css')
          css = path.read_text()
          old = '''.report-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            margin-top: 48px;
            border-top: 1px solid var(--rule);
          }

          .report-grid article {
            min-width: 0;
            padding: 26px 28px 30px;
            border-bottom: 1px solid var(--rule);
          }

          .report-grid article:nth-child(odd) {
            border-right: 1px solid var(--rule);
          }
          '''.replace('          ', '')
          new = '''.report-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            margin-top: 48px;
          }

          .report-grid article {
            min-width: 0;
            padding: 26px 28px 30px;
          }

          .report-grid article:nth-child(odd) {
            border-right: 1px solid var(--rule);
          }

          .report-grid article:nth-child(n + 3) {
            border-top: 1px solid var(--rule);
          }
          '''.replace('          ', '')
          if old not in css:
              raise SystemExit('Desktop report-grid block did not match')
          css = css.replace(old, new)

          old_mobile = '''  .report-grid article {
            padding: 25px 0 28px;
            border-right: 0;
          }
          '''.replace('          ', '')
          new_mobile = '''  .report-grid article {
            padding: 25px 0 28px;
            border-top: 0;
            border-right: 0;
          }

          .report-grid article + article {
            border-top: 1px solid var(--rule);
          }
          '''.replace('          ', '')
          if old_mobile not in css:
              raise SystemExit('Mobile report-grid block did not match')
          css = css.replace(old_mobile, new_mobile)
          path.write_text(css)
          PY
          rm .github/workflows/apply-report-open-grids.yml
          rm .github/workflows/apply-report-open-grids-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add technical-report.css .github/workflows/apply-report-open-grids.yml .github/workflows/apply-report-open-grids-pr.yml
          git commit -m "Use internal dividers for report grids"
          git push origin HEAD:fix/report-open-grids
