name: Fix report principle boundary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/report-principle-boundary' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/report-principle-boundary
      - name: Remove duplicate boundary and add regression coverage
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path("technical-report.css")
          css = css_path.read_text()
          old_css = ".report-principle {\n  margin-top: 46px;\n  padding: 30px 0;\n  border-top: 2px solid var(--jl-color-accent);\n  border-bottom: 1px solid var(--rule);\n}"
          new_css = ".report-principle {\n  margin-top: 46px;\n  padding: 30px 0;\n  border-top: 2px solid var(--jl-color-accent);\n}"
          if css.count(old_css) != 1:
              raise SystemExit(f"Expected one report principle boundary block, found {css.count(old_css)}")
          css_path.write_text(css.replace(old_css, new_css, 1))

          audit_path = Path("scripts/technical-report-visual-audit.mjs")
          audit = audit_path.read_text()
          old_nodes = '      const timeline = document.querySelector(".report-timeline article");\n      const reportGrids ='
          new_nodes = '      const timeline = document.querySelector(".report-timeline article");\n      const principle = document.querySelector(".report-principle");\n      const firstSection = document.querySelector(".report-section");\n      const reportGrids ='
          if audit.count(old_nodes) != 1:
              raise SystemExit(f"Expected one visual audit node anchor, found {audit.count(old_nodes)}")
          audit = audit.replace(old_nodes, new_nodes, 1)

          old_metrics = '        timelineDisplay: timeline ? getComputedStyle(timeline).display : null,\n        reportGrids,'
          new_metrics = '        timelineDisplay: timeline ? getComputedStyle(timeline).display : null,\n        principleBottomBorder: principle ? Number.parseFloat(getComputedStyle(principle).borderBottomWidth) : null,\n        firstSectionTopBorder: firstSection ? Number.parseFloat(getComputedStyle(firstSection).borderTopWidth) : null,\n        reportGrids,'
          if audit.count(old_metrics) != 1:
              raise SystemExit(f"Expected one visual audit metric anchor, found {audit.count(old_metrics)}")
          audit = audit.replace(old_metrics, new_metrics, 1)

          old_checks = '    if (metrics.timelineDisplay !== expectedTimeline) problems.push(`timeline display is ${metrics.timelineDisplay}, expected ${expectedTimeline}`);\n    for (const [gridIndex, grid] of metrics.reportGrids.entries()) {'
          new_checks = '    if (metrics.timelineDisplay !== expectedTimeline) problems.push(`timeline display is ${metrics.timelineDisplay}, expected ${expectedTimeline}`);\n    if (metrics.principleBottomBorder !== 0) problems.push(`report principle adds a duplicate bottom rule at ${metrics.principleBottomBorder}px`);\n    if (metrics.firstSectionTopBorder === null || metrics.firstSectionTopBorder < 1) problems.push("first report section is missing its boundary rule");\n    for (const [gridIndex, grid] of metrics.reportGrids.entries()) {'
          if audit.count(old_checks) != 1:
              raise SystemExit(f"Expected one visual audit check anchor, found {audit.count(old_checks)}")
          audit_path.write_text(audit.replace(old_checks, new_checks, 1))

          validator_path = Path("scripts/validate-technical-report.mjs")
          validator = validator_path.read_text()
          old_validator = 'if (styles.includes("backdrop-filter")) fail("Technical report stylesheet re-owns the shared header surface.");\n\nconst reportGridBlock ='
          new_validator = 'if (styles.includes("backdrop-filter")) fail("Technical report stylesheet re-owns the shared header surface.");\n\nconst reportPrincipleBlock = styles.match(/\\.report-principle \\{([^}]*)\\}/)?.[1] ?? "";\nif (/border-bottom\\s*:/.test(reportPrincipleBlock)) fail("Report principle must not duplicate the following section boundary.");\nif (!/border-top\\s*:/.test(reportPrincipleBlock)) fail("Report principle must retain its accent top rule.");\n\nconst reportGridBlock ='
          if validator.count(old_validator) != 1:
              raise SystemExit(f"Expected one static validator anchor, found {validator.count(old_validator)}")
          validator_path.write_text(validator.replace(old_validator, new_validator, 1))
          PY
          rm .github/workflows/fix-report-principle-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add technical-report.css scripts/technical-report-visual-audit.mjs scripts/validate-technical-report.mjs .github/workflows/fix-report-principle-boundary.yml
          git commit -m "Remove duplicate report principle boundary"
          git push origin HEAD:fix/report-principle-boundary
