name: Apply technical report full audit

on:
  push:
    branches:
      - fix/technical-report-full-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/technical-report-full-audit
      - name: Apply report markup and style corrections
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          html_path = Path("projects/network-diagnostics-suite/report/index.html")
          css_path = Path("technical-report.css")
          html = html_path.read_text()
          css = css_path.read_text()

          baseline = "b1c549c5c83c2101c8530d861e79710bf894f1ca"
          canonical = "https://johnnyli.dev/projects/network-diagnostics-suite/report/"

          old_head = '''    <meta name="description" content="A technical report on how Network Diagnostics Suite evolved from a browser speed test into a shared browser, desktop, and command-line diagnostic system.">
    <meta name="theme-color" content="#f2efe8">
    <meta property="og:title" content="Network Diagnostics Suite Technical Report — Johnny Li">
    <meta property="og:description" content="Measurement methodology, M-Lab benchmarking, transport investigation, native architecture, report compatibility, privacy, and validation.">
    <meta property="og:type" content="article">
    <title>Network Diagnostics Suite Technical Report — Johnny Li</title>
    <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">'''
          new_head = '''    <meta name="description" content="A technical report on how Network Diagnostics Suite evolved from a browser speed test into a shared browser, desktop, and command-line diagnostic system.">
    <meta name="author" content="Johnny Li">
    <meta name="keywords" content="network diagnostics, speed testing, M-Lab, NDT7, Cloudflare R2, Avalonia, report schema">
    <meta name="theme-color" content="#f2efe8">
    <meta property="og:title" content="Network Diagnostics Suite Technical Report — Johnny Li">
    <meta property="og:description" content="Measurement methodology, M-Lab benchmarking, transport investigation, native architecture, report compatibility, privacy, and validation.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://johnnyli.dev/projects/network-diagnostics-suite/report/">
    <meta property="og:image" content="https://johnnyli.dev/assets/network-diagnostics-report-social.svg">
    <meta property="article:published_time" content="2026-08-05T00:00:00-07:00">
    <meta property="article:modified_time" content="2026-08-05T21:49:00-07:00">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Network Diagnostics Suite Technical Report — Johnny Li">
    <meta name="twitter:description" content="Measurement methodology, M-Lab benchmarking, transport investigation, native architecture, report compatibility, privacy, and validation.">
    <meta name="twitter:image" content="https://johnnyli.dev/assets/network-diagnostics-report-social.svg">
    <title>Network Diagnostics Suite Technical Report — Johnny Li</title>
    <link rel="canonical" href="https://johnnyli.dev/projects/network-diagnostics-suite/report/">
    <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">'''
          if html.count(old_head) != 1:
              raise SystemExit("Report head block did not match")
          html = html.replace(old_head, new_head)

          html = html.replace(
              "compatible browser, desktop, and command-line measurement clients.",
              "compatible browser, desktop, and command-line interface (CLI) measurement clients.",
              1,
          )

          old_meta = '''        <dl class="report-meta">
          <div><dt>Author</dt><dd>Johnny Li</dd></div>
          <div><dt>Published</dt><dd>August 2026</dd></div>
          <div><dt>Scope</dt><dd>Browser · Desktop · CLI</dd></div>
          <div><dt>Report schema</dt><dd>2.0</dd></div>
        </dl>'''
          new_meta = f'''        <dl class="report-meta">
          <div><dt>Revision</dt><dd><time datetime="2026-08-05">1 · 2026-08-05</time></dd></div>
          <div><dt>Project baseline</dt><dd><a class="report-baseline" href="https://github.com/JohnnyZLi/Network-Diagnostics-Suite/commit/{baseline}" target="_blank" rel="noreferrer"><code>b1c549c</code></a></dd></div>
          <div><dt>Scope</dt><dd>Browser · Desktop · CLI</dd></div>
          <div><dt>Report schema</dt><dd>2.0</dd></div>
        </dl>
        <p class="report-print-provenance">Johnny Li · Revision 1 · 2026-08-05 · Network Diagnostics Suite baseline b1c549c · {canonical}</p>'''
          if html.count(old_meta) != 1:
              raise SystemExit("Report metadata block did not match")
          html = html.replace(old_meta, new_meta)

          heading_pattern = re.compile(
              r'(?P<indent>\s{12})(?P<body><p class="report-number">.*?</p>\n(?P=indent)<h2[^>]*>.*?</h2>(?:\n(?P=indent)<p class="report-(?:abstract-lede|lede)">.*?</p>)?)',
          )
          def wrap_heading(match):
              indent = match.group("indent")
              lines = match.group("body").splitlines()
              return f'{indent}<div class="report-heading-group">\n' + "\n".join(f"{indent}  {line.lstrip()}" for line in lines) + f"\n{indent}</div>"
          html, heading_count = heading_pattern.subn(wrap_heading, html)
          if heading_count != 15:
              raise SystemExit(f"Expected 15 report heading groups, created {heading_count}")

          def convert_grid(match):
              block = match.group(0)
              if block.count("<article>") != 4 or block.count("</article>") != 4:
                  raise SystemExit("Report grid did not contain four article cells")
              return block.replace("<article>", '<div class="report-grid-item">').replace("</article>", "</div>")
          html, grid_count = re.subn(
              r'<div class="report-grid">.*?</div>\n\s*</section>',
              convert_grid,
              html,
              flags=re.S,
          )
          if grid_count != 3:
              raise SystemExit(f"Expected three report grids, converted {grid_count}")

          replacements = {
              "Connection Check, Quick, Full, and Stress plus operating-system, interface, route, resolver, path, and LAN evidence.":
                  "Connection Check, Quick, Full, and Stress plus operating-system, interface, route, resolver, path, and local area network (LAN) evidence.",
              "Repeatable ICMP, traceroute, DNS, MTU, TCP/TLS, Wi-Fi, routing, optional Internet transfer, and two-machine LAN testing.":
                  "Repeatable Internet Control Message Protocol (ICMP), traceroute, Domain Name System (DNS), Maximum Transmission Unit (MTU), TCP/TLS, Wi-Fi, routing, optional Internet transfer, and two-machine LAN testing.",
              "Research into NDT7 corrected another assumption:":
                  "Research into Network Diagnostic Tool version 7 (NDT7) corrected another assumption:",
              "with BBR where available and server-side TCP instrumentation.":
                  "with Bottleneck Bandwidth and Round-trip propagation time (BBR) where available and server-side TCP instrumentation.",
              "Deeper evidence moved into a shared engine instead of being duplicated across <em>a GUI and a command line.</em>":
                  "Deeper evidence moved into a shared engine instead of being duplicated across <em>a graphical interface and a command line.</em>",
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f"Missing acronym cleanup fragment: {old}")
              html = html.replace(old, new, 1)

          html = html.replace(
              "versus roughly 198–206 Mbps down and 85–91 Mbps up through the project.</p>",
              "versus roughly 198–206 Mbps down and 85–91 Mbps up through the project.<a class=\"report-citation\" href=\"#ref-2\" aria-label=\"Reference 2\">[2]</a><a class=\"report-citation\" href=\"#ref-4\" aria-label=\"Reference 4\">[4]</a></p>",
              1,
          )
          html = html.replace(
              "comparison allocation, and Stress scaling stages.</p>",
              "comparison allocation, and Stress scaling stages.<a class=\"report-citation\" href=\"#ref-9\" aria-label=\"Reference 9\">[9]</a></p>",
              1,
          )
          html = html.replace(
              "Internet Protocol version when available.</p>",
              "Internet Protocol version when available.<a class=\"report-citation\" href=\"#ref-5\" aria-label=\"Reference 5\">[5]</a></p>",
              1,
          )
          html = html.replace(
              "findings, capability reporting, and serialization.</p>",
              "findings, capability reporting, and serialization.<a class=\"report-citation\" href=\"#ref-10\" aria-label=\"Reference 10\">[10]</a></p>",
              1,
          )

          old_comparison_table = '''            <section class="report-table-wrap jl-table-region" tabindex="0" aria-label="Observed comparison between M-Lab and Network Diagnostics Suite">
              <table class="report-table">
                <thead><tr><th scope="col">Development observation</th><th scope="col">M-Lab</th><th scope="col">Network Diagnostics Suite</th><th scope="col">Interpretation</th></tr></thead>
                <tbody>
                  <tr><th scope="row">Early comparison</th><td>≈381 Mbps down</td><td>≈182 Mbps down</td><td>The gap was too large to dismiss without isolating the serving path.</td></tr>
                  <tr><th scope="row">Later comparison</th><td>328.7 down / 86.2 up</td><td>≈198–206 down / 85–91 up</td><td>Upload agreement pointed toward a download-specific bottleneck.</td></tr>
                  <tr><th scope="row">Post-change observation</th><td>Not run concurrently</td><td>≈370.1 median / 366.3 steady down</td><td>The earlier 180–200 Mbps ceiling was not an unavoidable browser limit.</td></tr>
                </tbody>
              </table>
            </section>'''
          new_comparison_table = '''            <section class="report-table-wrap jl-table-region" tabindex="0" aria-label="Observed comparison between M-Lab and Network Diagnostics Suite">
              <table class="report-table">
                <caption class="report-table-caption">Development observations across the M-Lab and project measurement paths</caption>
                <thead><tr><th scope="col">Development observation</th><th scope="col">M-Lab</th><th scope="col">Network Diagnostics Suite</th><th scope="col">Interpretation</th></tr></thead>
                <tbody>
                  <tr><th scope="row">Early comparison</th><td data-label="M-Lab">≈381 Mbps down</td><td data-label="Network Diagnostics Suite">≈182 Mbps down</td><td data-label="Interpretation">The gap was too large to dismiss without isolating the serving path.</td></tr>
                  <tr><th scope="row">Later comparison</th><td data-label="M-Lab">328.7 down / 86.2 up</td><td data-label="Network Diagnostics Suite">≈198–206 down / 85–91 up</td><td data-label="Interpretation">Upload agreement pointed toward a download-specific bottleneck.</td></tr>
                  <tr><th scope="row">Post-change observation</th><td data-label="M-Lab">Not run concurrently</td><td data-label="Network Diagnostics Suite">≈370.1 median / 366.3 steady down</td><td data-label="Interpretation">The earlier 180–200 Mbps ceiling was not an unavoidable browser limit.</td></tr>
                </tbody>
              </table>
            </section>'''
          if html.count(old_comparison_table) != 1:
              raise SystemExit("Comparison table block did not match")
          html = html.replace(old_comparison_table, new_comparison_table)

          old_profile_table = '''            <section class="report-table-wrap jl-table-region" tabindex="0" aria-label="Native measurement profile limits">
              <table class="report-table">
                <thead><tr><th scope="col">Profile</th><th scope="col">Base estimate</th><th scope="col">Download cap</th><th scope="col">Upload cap</th><th scope="col">Deep diagnostics</th></tr></thead>
                <tbody>
                  <tr><th scope="row">Connection Check</th><td>15 seconds</td><td>20 MB</td><td>8 MB</td><td>No</td></tr>
                  <tr><th scope="row">Quick</th><td>20 seconds</td><td>600 MB</td><td>128 MB</td><td>No</td></tr>
                  <tr><th scope="row">Full</th><td>35 seconds</td><td>900 MB</td><td>256 MB</td><td>Yes</td></tr>
                  <tr><th scope="row">Stress</th><td>60 seconds</td><td>3 GB</td><td>512 MB</td><td>Yes</td></tr>
                </tbody>
              </table>
            </section>'''
          new_profile_table = '''            <section class="report-table-wrap jl-table-region" tabindex="0" aria-label="Native measurement profile limits">
              <table class="report-table">
                <caption class="report-table-caption">Native profile duration, transfer ceilings, and diagnostic scope</caption>
                <thead><tr><th scope="col">Profile</th><th scope="col">Base estimate</th><th scope="col">Download cap</th><th scope="col">Upload cap</th><th scope="col">Deep diagnostics</th></tr></thead>
                <tbody>
                  <tr><th scope="row">Connection Check</th><td data-label="Base estimate">15 seconds</td><td data-label="Download cap">20 MB</td><td data-label="Upload cap">8 MB</td><td data-label="Deep diagnostics">No</td></tr>
                  <tr><th scope="row">Quick</th><td data-label="Base estimate">20 seconds</td><td data-label="Download cap">600 MB</td><td data-label="Upload cap">128 MB</td><td data-label="Deep diagnostics">No</td></tr>
                  <tr><th scope="row">Full</th><td data-label="Base estimate">35 seconds</td><td data-label="Download cap">900 MB</td><td data-label="Upload cap">256 MB</td><td data-label="Deep diagnostics">Yes</td></tr>
                  <tr><th scope="row">Stress</th><td data-label="Base estimate">60 seconds</td><td data-label="Download cap">3 GB</td><td data-label="Upload cap">512 MB</td><td data-label="Deep diagnostics">Yes</td></tr>
                </tbody>
              </table>
            </section>'''
          if html.count(old_profile_table) != 1:
              raise SystemExit("Profile table block did not match")
          html = html.replace(old_profile_table, new_profile_table)

          old_figure = '''            <div class="report-bars" role="img" aria-label="Direct R2 steady throughput was 270.9 megabits per second compared with 157.9 megabits per second through the Worker stream">
              <div class="bar-row"><div><strong>Direct R2 object</strong><small>270.9 Mbps steady</small></div><div class="bar-track"><span class="bar-fill-direct"></span></div></div>
              <div class="bar-row"><div><strong>Worker stream</strong><small>157.9 Mbps steady</small></div><div class="bar-track"><span class="bar-fill-worker"></span></div></div>
            </div>'''
          new_figure = '''            <figure class="report-bars">
              <figcaption>Steady-state throughput by project-controlled delivery path</figcaption>
              <div class="bar-row"><div><strong>Direct R2 object</strong><small>270.9 Mbps steady</small></div><div class="bar-track" aria-hidden="true"><span class="bar-fill-direct"></span></div></div>
              <div class="bar-row"><div><strong>Worker stream</strong><small>157.9 Mbps steady</small></div><div class="bar-track" aria-hidden="true"><span class="bar-fill-worker"></span></div></div>
            </figure>'''
          if html.count(old_figure) != 1:
              raise SystemExit("Throughput figure block did not match")
          html = html.replace(old_figure, new_figure)

          html = html.replace(
              '<blockquote class="report-quote">A useful diagnostic tool does not need to know everything. It needs to make clear what it observed, what it inferred, and what remains unknown.</blockquote>',
              '<p class="report-quote">A useful diagnostic tool does not need to know everything. It needs to make clear what it observed, what it inferred, and what remains unknown.</p>',
              1,
          )

          commit_links = {
              "/commit/6ed3cdb\"": "/commit/6ed3cdb4fc9ef49d5e23f56de38353fcdf9c1c4e\"",
              "/commit/4bacb7e\"": "/commit/4bacb7e281d64af28af7c029204fd5091050dbc5\"",
              "/commit/7b27ea8\"": "/commit/7b27ea8682ad1130d729f232695ab534fa5a91a7\"",
              "/commit/8ec174d\"": "/commit/8ec174d7b6e082568a985877717e8af6081ad4a4\"",
          }
          for old, new in commit_links.items():
              if old not in html:
                  raise SystemExit(f"Missing commit link fragment: {old}")
              html = html.replace(old, new, 1)

          html = html.replace(
              "https://github.com/JohnnyZLi/Network-Diagnostics-Suite/blob/main/docs/methodology.md",
              f"https://github.com/JohnnyZLi/Network-Diagnostics-Suite/blob/{baseline}/docs/methodology.md",
              1,
          )
          html = html.replace(
              "https://github.com/JohnnyZLi/Network-Diagnostics-Suite/blob/main/README.md",
              f"https://github.com/JohnnyZLi/Network-Diagnostics-Suite/blob/{baseline}/README.md",
              1,
          )

          old_action_css = '''.report-actions {
  --jl-actions-gap: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 24px;
  row-gap: 0;
  align-items: start;
  margin-top: 30px;
}

.report-actions .report-action {
  width: 100%;
}

'''
          if css.count(old_action_css) != 1:
              raise SystemExit("Report action ownership block did not match")
          css = css.replace(old_action_css, "")

          css = css.replace(".report-toc {\n  position: sticky;\n  top: 116px;\n}", ".report-toc {\n  position: sticky;\n  top: 116px;\n  scroll-margin-top: 110px;\n}", 1)
          css = css.replace(".report-intro {\n  padding-bottom: 84px;\n}", ".report-intro {\n  padding-bottom: 44px;\n}\n\n.report-intro + .report-section {\n  padding-top: 62px;\n}", 1)
          css = css.replace(".report-grid article", ".report-grid-item")
          css = css.replace(".report-grid-item:nth-child(odd)", ".report-grid-item:nth-child(odd)")

          old_table_wrap = '''.report-table-wrap {
  --jl-table-region-border-width: 0;
  --jl-table-region-radius: 0;
  --jl-table-region-background: transparent;
  margin-top: 46px;
}

.report-table {'''
          new_table_wrap = '''.report-table-wrap {
  --jl-table-region-border-width: 0;
  --jl-table-region-radius: 0;
  --jl-table-region-background: transparent;
  margin-top: 46px;
}

.report-table-caption {
  padding: 0 0 14px;
  color: var(--muted);
  font-family: var(--jl-font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-align: left;
  text-transform: uppercase;
}

.report-table {'''
          if css.count(old_table_wrap) != 1:
              raise SystemExit("Report table style block did not match")
          css = css.replace(old_table_wrap, new_table_wrap)

          old_bars = '''.report-bars {
  margin-top: 46px;
  padding: 28px;
  border: 1px solid var(--rule);
}

.bar-row {'''
          new_bars = '''.report-bars {
  margin: 46px 0 0;
  padding: 24px 0 28px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.report-bars figcaption {
  margin-bottom: 24px;
  color: var(--muted);
  font-family: var(--jl-font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.bar-row {'''
          if css.count(old_bars) != 1:
              raise SystemExit("Report bar style block did not match")
          css = css.replace(old_bars, new_bars)

          css = css.replace(
              ".references a {\n  border-bottom: 1px solid var(--jl-color-accent-decorative);\n}",
              ".references a {\n  border-bottom: 1px solid var(--jl-color-accent-decorative);\n}\n\n.report-baseline {\n  border-bottom: 1px solid var(--jl-color-accent-decorative);\n  color: var(--ink);\n}\n\n.report-baseline code {\n  font: 0.82rem var(--jl-font-mono);\n}\n\n.report-print-provenance {\n  display: none;\n}",
              1,
          )

          mobile_tables = '''
@media (max-width: 700px) {
  .report-table-wrap {
    overflow: visible;
  }

  .report-table {
    display: block;
    min-width: 0;
  }

  .report-table thead {
    position: absolute;
    overflow: hidden;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .report-table tbody,
  .report-table tr,
  .report-table th,
  .report-table td {
    display: block;
    width: auto;
  }

  .report-table tbody tr {
    padding: 20px 0;
    border-top: 1px solid var(--rule);
  }

  .report-table tbody tr:last-child {
    border-bottom: 1px solid var(--rule);
  }

  .report-table th,
  .report-table td {
    padding: 0;
    border: 0;
  }

  .report-table tbody th {
    width: auto;
    margin-bottom: 12px;
    font-size: 1rem;
  }

  .report-table tbody td {
    display: grid;
    grid-template-columns: minmax(112px, 0.45fr) minmax(0, 1fr);
    gap: 16px;
    padding: 7px 0;
  }

  .report-table tbody td::before {
    color: var(--clay);
    content: attr(data-label);
    font-family: var(--jl-font-mono);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.45;
    text-transform: uppercase;
  }
}
'''
          marker = "@media (max-width: 600px) {"
          if css.count(marker) != 1:
              raise SystemExit("Mobile media marker did not match")
          css = css.replace(marker, mobile_tables + "\n" + marker, 1)

          css = css.replace(
              "  .report-hero h1 {\n    font-size: clamp(3.2rem, 14vw, 4.7rem);\n  }",
              "  .report-hero h1 {\n    font-size: clamp(3.05rem, 14vw, 4.7rem);\n  }\n\n  .report-intro h2,\n  .report-section h2 {\n    font-size: clamp(2.25rem, 11.5vw, 3.25rem);\n  }\n\n  .report-intro {\n    padding-bottom: 36px;\n  }\n\n  .report-intro + .report-section {\n    padding-top: 54px;\n  }",
              1,
          )
          css = css.replace("  .report-actions {\n    grid-template-columns: 1fr;\n  }\n\n", "", 1)

          css = css.replace(
              "  .report-section {\n    padding: 0.44in 0 0.5in;\n    break-before: auto;\n  }",
              "  .report-section {\n    padding: 0.34in 0 0.4in;\n    break-before: auto;\n  }\n\n  .report-heading-group {\n    break-after: avoid-page;\n    break-inside: avoid-page;\n  }",
              1,
          )
          css = css.replace(
              "  .report-intro h2,\n  .report-section h2 {\n    font-size: 25pt;\n    line-height: 1;\n  }",
              "  .report-intro h2,\n  .report-section h2 {\n    font-size: 23pt;\n    line-height: 1;\n  }",
              1,
          )
          css = css.replace("    font-size: 15.5pt;", "    font-size: 14pt;", 1)
          css = css.replace(
              "  .report-prose p {\n    font-size: 9.2pt;\n    line-height: 1.58;\n  }",
              "  .report-prose p {\n    font-size: 9.2pt;\n    line-height: 1.58;\n    orphans: 3;\n    widows: 3;\n  }\n\n  .report-heading-group + .report-prose,\n  .report-prose p:first-child {\n    break-before: avoid-page;\n  }",
              1,
          )
          css = css.replace(
              "  .report-principle,\n  .report-bars,\n  .report-code,\n  .report-quote {",
              "  .report-principle,\n  .report-bars,\n  .report-code,\n  .report-quote {",
              1,
          )
          css = css.replace(
              "  .report-bars {\n    margin-top: 0.28in;\n    padding: 0.17in;\n  }",
              "  .report-bars {\n    margin-top: 0.28in;\n    padding: 0.14in 0 0.17in;\n  }",
              1,
          )
          css = css.replace(
              "  .references li {\n    font-size: 7.4pt;\n  }",
              "  .references li {\n    font-size: 7.4pt;\n  }\n\n  .references a[href^=\"http\"]::after {\n    content: \" <\" attr(href) \">\";\n    font-family: var(--jl-font-mono);\n    font-size: 0.82em;\n    overflow-wrap: anywhere;\n  }\n\n  .report-print-provenance {\n    display: block;\n    margin: 0.18in 0 0;\n    color: var(--muted);\n    font: 6.8pt/1.4 var(--jl-font-mono);\n  }",
              1,
