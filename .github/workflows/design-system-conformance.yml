name: Design-system conformance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    uses: JohnnyZLi/Web-Design-System/.github/workflows/consumer-conformance.yml@abb6c44f588afe09e8f593a8c467b564ac9fef86
    with:
      node-version: "24"
      timeout-minutes: 15
      install-command: npm install --no-audit --no-fund --no-package-lock
      conformance-command: npm run design-system:integration && npm run design-system:conformance && npm run lint:html && npm run lint:css
      artifact-name: portfolio-design-system-conformance
