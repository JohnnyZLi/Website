name: One-time pinned controls sync

on:
  push:
    branches: ["agent/pin-open-shared-header-controls"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Sync latest shared design system
        run: |
          npm install --no-audit --no-fund
          npm run design-system:update
          npm install --no-audit --no-fund
          npm run design-system:sync
          rm .github/workflows/one-time-sync-pinned-controls.yml
      - name: Commit synchronized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync pinned shared header controls"
          git push origin HEAD:${GITHUB_REF_NAME}
