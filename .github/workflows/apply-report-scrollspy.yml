name: Apply report scroll navigation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/apply-report-scrollspy.yml"
      - "technical-report.js"
      - "scripts/technical-report-visual-baseline.json"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/technical-report-scrollspy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/technical-report-scrollspy
      - name: Apply scroll-aware contents implementation
        run: |
          python3 <<'PY'
          from pathlib import Path

          report_path = Path("projects/network-diagnostics-suite/report/index.html")
          report = report_path.read_text()
          old_toc = '''        <aside class="report-toc" id="contents" aria-label="Report contents">
          <p>Contents</p>
          <ol>
            <li><a href="#origin">From speed test to diagnostic system</a></li>
            <li><a href="#browser-boundary">The browser boundary</a></li>
            <li><a href="#mlab">Benchmarking against M-Lab</a></li>
            <li><a href="#delivery-path">Finding the download bottleneck</a></li>
            <li><a href="#measurement-plan">A shared measurement plan</a></li>
            <li><a href="#interpretation">Throughput and responsiveness</a></li>
            <li><a href="#endpoint-context">Endpoint and transport context</a></li>
            <li><a href="#native">The native core</a></li>
            <li><a href="#reports">Schema 2.0 and findings parity</a></li>
            <li><a href="#lan">LAN isolation and interface binding</a></li>
            <li><a href="#privacy">Privacy and accuracy</a></li>
            <li><a href="#validation">Validation and release engineering</a></li>
            <li><a href="#lessons">Lessons and next work</a></li>
          </ol>
        </aside>
'''
          new_toc = '''        <aside class="report-toc" id="contents" aria-label="Report contents" data-report-toc>
          <p>Contents</p>
          <div class="report-toc-list">
            <span class="report-toc-indicator" aria-hidden="true" data-report-toc-indicator></span>
            <ol>
              <li><a href="#origin" data-report-section-link>From speed test to diagnostic system</a></li>
              <li><a href="#browser-boundary" data-report-section-link>The browser boundary</a></li>
              <li><a href="#mlab" data-report-section-link>Benchmarking against M-Lab</a></li>
              <li><a href="#delivery-path" data-report-section-link>Finding the download bottleneck</a></li>
              <li><a href="#measurement-plan" data-report-section-link>A shared measurement plan</a></li>
              <li><a href="#interpretation" data-report-section-link>Throughput and responsiveness</a></li>
              <li><a href="#endpoint-context" data-report-section-link>Endpoint and transport context</a></li>
              <li><a href="#native" data-report-section-link>The native core</a></li>
              <li><a href="#reports" data-report-section-link>Schema 2.0 and findings parity</a></li>
              <li><a href="#lan" data-report-section-link>LAN isolation and interface binding</a></li>
              <li><a href="#privacy" data-report-section-link>Privacy and accuracy</a></li>
              <li><a href="#validation" data-report-section-link>Validation and release engineering</a></li>
              <li><a href="#lessons" data-report-section-link>Lessons and next work</a></li>
            </ol>
          </div>
        </aside>

        <nav class="report-progress" aria-label="Current report section" data-report-progress hidden>
          <div class="report-progress-controls">
            <a class="report-progress-direction" data-report-progress-previous aria-disabled="true"><span aria-hidden="true">←</span><span class="jl-visually-hidden">Previous section</span></a>
            <button class="report-progress-current" type="button" aria-expanded="false" aria-controls="report-progress-menu" data-report-progress-toggle>
              <span class="report-progress-counter" data-report-progress-counter>00 / 13</span>
              <span class="report-progress-title" data-report-progress-title>Report contents</span>
              <span class="report-progress-chevron" aria-hidden="true">⌄</span>
            </button>
            <a class="report-progress-direction" href="#origin" data-report-progress-next aria-label="Next section: From speed test to diagnostic system"><span aria-hidden="true">→</span><span class="jl-visually-hidden">Next section</span></a>
          </div>
          <span class="report-progress-track" aria-hidden="true"><span data-report-progress-fill></span></span>
          <div class="report-progress-menu" id="report-progress-menu" data-report-progress-menu hidden></div>
        </nav>
'''
          if report.count(old_toc) != 1:
              raise SystemExit("Expected one canonical report contents block")
          report = report.replace(old_toc, new_toc)
          report = report.replace(
              '<meta property="article:modified_time" content="2026-08-05T21:49:00-07:00">',
              '<meta property="article:modified_time" content="2026-08-06T00:18:00-07:00">',
          )
          report_path.write_text(report)

          css_path = Path("technical-report.css")
          css = css_path.read_text()
          marker = "@media (max-width: 1050px) {"
          scroll_styles = r'''
.report-toc-list {
  position: relative;
}

.report-toc-indicator {
  --report-toc-indicator-y: 0px;
  --report-toc-indicator-height: 0px;
  position: absolute;
  z-index: 1;
  top: 0;
  left: -14px;
  width: 2px;
  height: var(--report-toc-indicator-height);
  background: var(--jl-color-accent);
  opacity: 0;
  transform: translateY(var(--report-toc-indicator-y));
  transition:
    transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
    height 180ms ease,
    opacity 120ms ease;
  pointer-events: none;
}

.report-toc-indicator.is-visible {
  opacity: 1;
}

.report-toc li {
  position: relative;
}

.report-toc a {
  transition: color 160ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.report-toc li.is-active a {
  color: var(--ink);
  transform: translateX(5px);
}

.report-toc li.is-active a::before {
  color: var(--jl-color-accent);
}

.report-toc li.is-complete a::before {
  color: var(--jl-color-accent-decorative);
}

.report-progress {
  display: none;
}

.report-progress[hidden],
.report-progress-menu[hidden] {
  display: none;
}

@media (hover: hover) {
  .report-toc a:hover {
    color: var(--ink);
    transform: translateX(3px);
  }
}

'''
          if marker not in css:
              raise SystemExit("Technical report responsive marker missing")
          css = css.replace(marker, scroll_styles + marker, 1)

          compact_marker = "@media (max-width: 760px) {"
          compact_styles = r'''
@media (max-width: 820px) {
  .report-toc {
    margin-bottom: 28px;
  }

  .report-toc-indicator {
    display: none;
  }

  .report-progress {
    position: sticky;
    z-index: 18;
    top: 83px;
    display: block;
    margin-bottom: 52px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    background: var(--jl-color-canvas);
  }

  .report-progress-controls {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr) 46px;
    min-height: 68px;
    align-items: stretch;
  }

  .report-progress-direction {
    display: grid;
    place-items: center;
    color: var(--ink);
    font-size: 1rem;
  }

  .report-progress-direction:first-child {
    border-right: 1px solid var(--rule);
  }

  .report-progress-direction:last-child {
    border-left: 1px solid var(--rule);
  }

  .report-progress-direction.is-disabled {
    color: var(--muted);
    opacity: 0.35;
    pointer-events: none;
  }

  .report-progress-current {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    min-width: 0;
    padding: 11px 16px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .report-progress-counter {
    color: var(--jl-color-accent);
    font: 700 0.67rem/1 var(--jl-font-mono);
    letter-spacing: 0.06em;
  }

  .report-progress-title {
    overflow: hidden;
    font-size: 0.88rem;
    font-weight: 650;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .report-progress-chevron {
    color: var(--jl-color-accent-decorative);
    transition: transform 180ms ease;
  }

  .report-progress.is-menu-open .report-progress-chevron {
    transform: rotate(180deg);
  }

  .report-progress-track {
    position: absolute;
    right: 0;
    bottom: -1px;
    left: 0;
    height: 2px;
    background: color-mix(in srgb, var(--jl-color-ink) 10%, transparent);
  }

  .report-progress-track > span {
    --report-progress: 0%;
    display: block;
    width: var(--report-progress);
    height: 100%;
    background: var(--jl-color-accent);
    transition: width 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .report-progress-menu {
    position: absolute;
    top: 100%;
    right: 0;
    left: 0;
    max-height: min(60vh, 520px);
    overflow-y: auto;
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    border-left: 1px solid var(--rule);
    background: var(--jl-color-canvas);
    box-shadow: 0 18px 28px color-mix(in srgb, var(--jl-color-ink) 12%, transparent);
  }

  .report-progress-list {
    margin: 0;
    padding: 8px 18px 16px;
    list-style: none;
    counter-reset: progress-list;
  }

  .report-progress-list li {
    counter-increment: progress-list;
    border-top: 1px solid var(--rule);
  }

  .report-progress-list li:last-child {
    border-bottom: 1px solid var(--rule);
  }

  .report-progress-list a {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    gap: 10px;
    padding: 12px 0;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.4;
  }

  .report-progress-list a::before {
    color: var(--jl-color-accent-decorative);
    content: counter(progress-list, decimal-leading-zero);
    font-family: var(--jl-font-mono);
    font-size: 0.68rem;
  }

  .report-progress-list a[aria-current="location"] {
    color: var(--ink);
  }

  .report-progress-list a[aria-current="location"]::before {
    color: var(--jl-color-accent);
  }

  .report-section,
  .references li {
    scroll-margin-top: 170px;
  }
}

'''
          if compact_marker not in css:
              raise SystemExit("Technical report compact table marker missing")
          css = css.replace(compact_marker, compact_styles + compact_marker, 1)
          css = css.replace(
              "@media (max-width: 600px) {\n  .report-hero {",
              "@media (max-width: 600px) {\n  .report-progress {\n    top: 69px;\n  }\n\n  .report-progress-current {\n    gap: 9px;\n    padding-inline: 12px;\n  }\n\n  .report-progress-title {\n    font-size: 0.82rem;\n  }\n\n  .report-hero {",
              1,
          )
          css = css.replace(
              "@media (forced-colors: active) {\n  .report-bars,",
              "@media (prefers-reduced-motion: reduce) {\n  .report-toc-indicator,\n  .report-toc a,\n  .report-progress-chevron,\n  .report-progress-track > span {\n    transition-duration: 0s;\n  }\n}\n\n@media (forced-colors: active) {\n  .report-toc-indicator,\n  .report-progress-track > span {\n    background: CanvasText;\n  }\n\n  .report-bars,",
              1,
          )
          css = css.replace(
              "  .report-toc,\n  .report-ending,",
              "  .report-toc,\n  .report-progress,\n  .report-ending,",
              1,
          )
          css_path.write_text(css)

          audit_path = Path("scripts/technical-report-visual-audit.mjs")
          audit = audit_path.read_text()
          insertion_point = '''    const screenshotHash = await fileHash(screenshotPath);
'''
          navigation_audit = r'''    await page.locator('[data-report-section-link][href="#delivery-path"]').click();
    await page.waitForTimeout(250);
    const readingNavigation = await page.evaluate(() => {
      const activeLink = document.querySelector('[data-report-section-link][aria-current="location"]');
      const activeItem = activeLink?.closest('li');
      const indicator = document.querySelector('[data-report-toc-indicator]');
      const progress = document.querySelector('[data-report-progress]');
      const progressFill = document.querySelector('[data-report-progress-fill]');
      const currentSection = document.querySelector('#delivery-path');
      const rect = (element) => {
        const bounds = element?.getBoundingClientRect();
        return bounds ? { top: bounds.top, bottom: bounds.bottom, left: bounds.left, height: bounds.height } : null;
      };
      return {
        hash: location.hash,
        activeHref: activeLink?.getAttribute('href') ?? null,
        activeCurrent: activeLink?.getAttribute('aria-current') ?? null,
        activeItem: rect(activeItem),
        indicator: rect(indicator),
        indicatorOpacity: indicator ? getComputedStyle(indicator).opacity : null,
        indicatorTransition: indicator ? getComputedStyle(indicator).transitionDuration : null,
        progressDisplay: progress ? getComputedStyle(progress).display : null,
        progressPosition: progress ? getComputedStyle(progress).position : null,
        progressCounter: document.querySelector('[data-report-progress-counter]')?.textContent.trim() ?? null,
        progressTitle: document.querySelector('[data-report-progress-title]')?.textContent.trim() ?? null,
        previousHref: document.querySelector('[data-report-progress-previous]')?.getAttribute('href') ?? null,
        nextHref: document.querySelector('[data-report-progress-next]')?.getAttribute('href') ?? null,
        progressWidth: progressFill?.style.getPropertyValue('--report-progress') ?? null,
        progressTransition: progressFill ? getComputedStyle(progressFill).transitionDuration : null,
        progressRect: rect(progress),
        sectionRect: rect(currentSection),
      };
    });
    if (readingNavigation.hash !== '#delivery-path' || readingNavigation.activeHref !== '#delivery-path' || readingNavigation.activeCurrent !== 'location') problems.push('scroll-aware contents did not activate section 04 or update the hash');
    if (viewport.width > 820) {
      if (readingNavigation.progressDisplay !== 'none') problems.push('compact report progress is visible on desktop');
      if (readingNavigation.indicatorOpacity !== '1' || !readingNavigation.indicator || !readingNavigation.activeItem) problems.push('desktop report contents indicator is not visible');
      else if (Math.abs(readingNavigation.indicator.top - readingNavigation.activeItem.top) > 1 || Math.abs(readingNavigation.indicator.height - readingNavigation.activeItem.height) > 1) problems.push('desktop report contents indicator is not aligned with the active row');
    } else {
      if (readingNavigation.progressDisplay === 'none' || readingNavigation.progressPosition !== 'sticky') problems.push('compact report progress is not sticky and visible while reading');
      if (readingNavigation.progressCounter !== '04 / 13' || readingNavigation.progressTitle !== 'Finding the download bottleneck') problems.push('compact report progress does not identify the active section');
      if (readingNavigation.previousHref !== '#mlab' || readingNavigation.nextHref !== '#measurement-plan' || readingNavigation.progressWidth !== '30.76923076923077%') problems.push('compact report progress controls do not match section 04');
      if (readingNavigation.progressRect && readingNavigation.sectionRect && readingNavigation.sectionRect.top < readingNavigation.progressRect.bottom + 6) problems.push('compact report section lands beneath the sticky progress control');
      await page.locator('[data-report-progress-toggle]').click();
      const progressMenuOpened = await page.locator('[data-report-progress-menu]').isVisible();
      const progressMenuCurrent = await page.locator('[data-report-progress-link][aria-current="location"]').getAttribute('href');
      await page.keyboard.press('Escape');
      const progressMenuFocusRestored = await page.evaluate(() => document.activeElement?.hasAttribute('data-report-progress-toggle') ?? false);
      if (!progressMenuOpened || progressMenuCurrent !== '#delivery-path' || !progressMenuFocusRestored) problems.push('compact report progress menu does not expose the active section and restore focus');
    }
    if (readingNavigation.indicatorTransition?.split(',').some((duration) => duration.trim() !== '0s') || readingNavigation.progressTransition?.split(',').some((duration) => duration.trim() !== '0s')) problems.push('reduced-motion report navigation still animates');

'''
          if insertion_point not in audit:
              raise SystemExit("Rendered audit insertion point missing")
          audit = audit.replace(insertion_point, navigation_audit + insertion_point, 1)

          motion_marker = '''  const printContext = await browser.newContext({ viewport: { width: 816, height: 1056 }, reducedMotion: "reduce" });
'''
          motion_audit = r'''  const motionContext = await browser.newContext({ viewport: { width: 1440, height: 1000 }, reducedMotion: "no-preference" });
  const motionPage = await motionContext.newPage();
  await motionPage.goto(`${baseUrl}${route}`, { waitUntil: "networkidle" });
  await motionPage.locator('[data-report-section-link][href="#delivery-path"]').click();
  await motionPage.waitForTimeout(80);
  const motionMetrics = await motionPage.evaluate(() => ({
    indicatorDuration: getComputedStyle(document.querySelector('[data-report-toc-indicator]')).transitionDuration,
    linkDuration: getComputedStyle(document.querySelector('[data-report-section-link][aria-current="location"]')).transitionDuration,
  }));
  const motionProblems = [];
  if (!motionMetrics.indicatorDuration.split(',').some((duration) => Number.parseFloat(duration) > 0)) motionProblems.push('desktop contents indicator has no motion when motion is allowed');
  if (!motionMetrics.linkDuration.split(',').some((duration) => Number.parseFloat(duration) > 0)) motionProblems.push('active contents link has no transition when motion is allowed');
  results.push({ name: 'motion', ...motionMetrics, problems: motionProblems });
  await motionContext.close();

'''
          if motion_marker not in audit:
              raise SystemExit("Motion audit insertion point missing")
          audit = audit.replace(motion_marker, motion_audit + motion_marker, 1)
          audit_path.write_text(audit)

          validator_path = Path("scripts/validate-technical-report.mjs")
          validator = validator_path.read_text()
          validator = validator.replace(
              "  'class=\"report-abstract-lede\"',",
              "  'class=\"report-abstract-lede\"',\n  'data-report-toc',\n  'data-report-toc-indicator',\n  'data-report-section-link',\n  'data-report-progress',\n  'data-report-progress-toggle',\n  'data-report-progress-menu',",
              1,
          )
          validator = validator.replace(
              '  ".report-abstract-lede",',
              '  ".report-abstract-lede",\n  ".report-toc-indicator",\n  ".report-progress-controls",\n  ".report-progress-menu",\n  "@media (prefers-reduced-motion: reduce)",',
              1,
          )
          validator = validator.replace(
              'if (!behavior.includes("window.print()")) fail("Technical report print behavior is missing.");',
              '''requireFragments(behavior, [
  "window.print()",
  "IntersectionObserver",
  "history.replaceState",
  "aria-current', 'location'",
  "data-report-progress-link",
  "prefers-reduced-motion: reduce",
], "Technical report behavior");''',
              1,
          )
          validator = validator.replace(
              '  "compact report actions are not three full-width stacked rows",',
              '  "compact report actions are not three full-width stacked rows",\n  "scroll-aware contents did not activate section 04",\n  "compact report progress menu",\n  "desktop contents indicator has no motion",',
              1,
          )
          validator_path.write_text(validator)
          PY
          rm .github/workflows/apply-report-scrollspy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/network-diagnostics-suite/report/index.html technical-report.css scripts/technical-report-visual-audit.mjs scripts/validate-technical-report.mjs .github/workflows/apply-report-scrollspy.yml
          git commit -m "Add scroll-aware report contents"
          git push origin HEAD:feat/technical-report-scrollspy
