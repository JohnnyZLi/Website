name: Visual audit

on:
  pull_request:
    paths:
      - ".github/workflows/visual-audit.yml"

permissions:
  contents: write

jobs:
  consolidate-report-navigation:
    if: github.event.pull_request.head.ref == 'feat/technical-report-scrollspy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/technical-report-scrollspy
          fetch-depth: 0
      - name: Consolidate report contents CSS
        run: |
          git fetch origin main
          python3 <<'PY'
          from pathlib import Path

          path = Path('technical-report.css')
          css = path.read_text()

          original_item = '''.report-toc li {
  counter-increment: toc;
  border-top: 1px solid var(--rule);
}'''
          merged_item = '''.report-toc li {
  position: relative;
  counter-increment: toc;
  border-top: 1px solid var(--rule);
}'''
          original_link = '''.report-toc a {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  padding: 12px 0;
  color: var(--muted);
  font-size: 0.76rem;
  line-height: 1.4;
}'''
          merged_link = '''.report-toc a {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  padding: 12px 0;
  color: var(--muted);
  font-size: 0.76rem;
  line-height: 1.4;
  transition: color 160ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}'''
          duplicate = '''.report-toc li {
  position: relative;
}

.report-toc a {
  transition: color 160ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

'''

          if css.count(original_item) != 1 or css.count(original_link) != 1 or css.count(duplicate) != 1:
              raise SystemExit('Expected report contents selector structure was not found')
          css = css.replace(original_item, merged_item, 1)
          css = css.replace(original_link, merged_link, 1)
          css = css.replace(duplicate, '', 1)
          path.write_text(css)
          PY
          git show origin/main:.github/workflows/visual-audit.yml > .github/workflows/visual-audit.yml
          git show origin/main:.github/workflows/technical-report-audit.yml > .github/workflows/technical-report-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add technical-report.css .github/workflows/visual-audit.yml .github/workflows/technical-report-audit.yml
          git commit -m "Consolidate report contents selectors"
          git push origin HEAD:feat/technical-report-scrollspy
