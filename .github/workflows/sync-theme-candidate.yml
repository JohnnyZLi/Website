name: Sync shared theme candidate

on:
  push:
    branches: ["feat/shared-dark-mode"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-dark-mode
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Pin and synchronize candidate
        env:
          WDS_SHA: d77a0d73981fc7e38e0ad8271efc2537057d516a
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.WDS_SHA;
          fs.writeFileSync('design-system.lock.json', `${JSON.stringify({ package: '@johnnyzli/web-design-system', version: '1.9.0', sourceCommit: sha }, null, 2)}\n`);
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          manifest.dependencies['@johnnyzli/web-design-system'] = `github:JohnnyZLi/Web-Design-System#${sha}`;
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm install --no-audit --no-fund
          npm run design-system:sync
          rm .github/workflows/sync-theme-candidate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sync cleaned shared theme candidate"
          git push origin HEAD:feat/shared-dark-mode
