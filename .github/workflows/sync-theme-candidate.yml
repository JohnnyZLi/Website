name: Synchronize theme candidate

on:
  push:
    branches: ["feat/shared-dark-mode"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-dark-mode
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Synchronize package and audit
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/theme-visual-audit.mjs')
          text = path.read_text()
          needle = '  let printState = await printPage.evaluate(() => ({ theme: document.documentElement.dataset.theme, themeColor: document.querySelector(\'meta[name="theme-color"]\')?.content }));\n'
          replacement = '  await printPage.evaluate(() => window.dispatchEvent(new Event("beforeprint")));\n' + needle
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('print audit insertion point missing')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
          npm install --no-audit --no-fund
          npm run design-system:sync
          rm .github/workflows/sync-theme-candidate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize validated theme candidate"
          git push origin HEAD:feat/shared-dark-mode
