name: Apply attached Sites sync

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sites-menu-attached-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/sites-menu-attached-sync
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Sync shared design system
        run: |
          npm install --no-audit --no-fund
          npm run design-system:sync
          python3 .github/scripts/apply-sites-attached-contract.py
          git diff --check
      - name: Commit generated state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/design-system design-system.lock.json package.json package-lock.json index.html projects site-switcher.js portfolio-navigation.js scripts/validate-design-system-integration.mjs scripts/theme-visual-audit.mjs
          git commit -m "Sync attached Sites menu geometry"
          git push origin HEAD:agent/sites-menu-attached-sync
