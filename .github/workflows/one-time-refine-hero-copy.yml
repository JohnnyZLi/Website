name: One-time refine hero copy

on:
  push:
    branches:
      - portfolio/refine-hero-copy
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.event_name == 'push' || github.head_ref == 'portfolio/refine-hero-copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/refine-hero-copy
          fetch-depth: 0

      - name: Refine portfolio hero
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          replacements = [
              ('<span class="hero-line">I make</span>', '<span class="hero-line">Networks, systems,</span>'),
              ('<span class="hero-line">network <em>behavior</em></span>', '<span class="hero-line">and infrastructure—</span>'),
              ('<span class="hero-line"><em>visible.</em></span>', '<span class="hero-line">built to be <em>understood.</em></span>'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one hero token: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-refine-hero-copy.yml

      - name: Commit hero refinement
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add index.html .github/workflows/one-time-refine-hero-copy.yml
          git commit -m "Refine portfolio hero copy"
          git push origin HEAD:portfolio/refine-hero-copy
