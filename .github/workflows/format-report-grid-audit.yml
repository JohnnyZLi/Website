name: Format report grid audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/report-open-grids' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/report-open-grids
      - name: Normalize audit indentation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/technical-report-visual-audit.mjs')
          source = path.read_text()

          setup_pattern = re.compile(r'^const reportGrids = .*?^const root = getComputedStyle\(document\.documentElement\);$', re.M | re.S)
          setup_match = setup_pattern.search(source)
          if not setup_match:
              raise SystemExit('Report-grid setup block did not match')
          setup = '\n'.join(f'      {line}' for line in setup_match.group(0).splitlines())
          source = source[:setup_match.start()] + setup + source[setup_match.end():]

          problem_pattern = re.compile(r'^for \(const \[gridIndex, grid\] of metrics\.reportGrids\.entries\(\)\) \{.*?^if \(metrics\.inlineStyles !== 0\) problems\.push\("inline style attributes remain"\);$', re.M | re.S)
          problem_match = problem_pattern.search(source)
          if not problem_match:
              raise SystemExit('Report-grid problem block did not match')
          problems = '\n'.join(f'    {line}' for line in problem_match.group(0).splitlines())
          source = source[:problem_match.start()] + problems + source[problem_match.end():]

          path.write_text(source)
          PY
          rm .github/workflows/format-report-grid-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/technical-report-visual-audit.mjs .github/workflows/format-report-grid-audit.yml
          git commit -m "Format report grid audit assertions"
          git push origin HEAD:fix/report-open-grids
