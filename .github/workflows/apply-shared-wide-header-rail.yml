name: Apply shared wide header rail

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Point Portfolio at shared rail source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          source = '11da218c3eb864013f051dddea644c19ea9847e4'

          lock_path = Path('design-system.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sourceCommit'] = source
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@johnnyzli/web-design-system'] = f'github:JohnnyZLi/Web-Design-System#{source}'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY
          npm install --no-audit --no-fund --no-package-lock
          npm run design-system:sync
      - name: Remove superseded Portfolio-only rail adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('design-system-migration.css')
          text = path.read_text()
          block = '''/* On wide portfolio viewports, let the header use the screen instead of the
   content shell. Keep identity and controls edge-anchored while the nav stays
   centered independently of the unequal side content. */
@media (min-width: 1024px) {
  .jl-global-header__inner {
    width: 100%;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    padding-left: 40px;
    padding-right: 20px;
  }

  .jl-site-identity {
    justify-self: start;
  }

  .jl-global-header__nav {
    justify-self: center;
    transform: translateX(-10px);
  }

  .jl-global-header__actions {
    justify-self: end;
  }
}

'''
          if block not in text:
              raise SystemExit('Portfolio rail adapter block not found')
          path.write_text(text.replace(block, '', 1))
          PY
      - name: Commit synchronized Portfolio
        run: |
          git config user.name "JohnnyZLi"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git rm .github/workflows/apply-shared-wide-header-rail.yml
          git add design-system.lock.json package.json assets/design-system index.html projects site-switcher.js portfolio-navigation.js design-system-migration.css
          git commit -m "Adopt shared wide desktop header rail"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
