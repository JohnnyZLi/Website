name: Correct theme audit assertions

on:
  push:
    branches: ["feat/shared-dark-mode"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-dark-mode
      - name: Patch assertions
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/theme-visual-audit.mjs')
          text = path.read_text()
          text = text.replace(
              'document.querySelectorAll("[data-theme-preference]").length',
              'document.querySelectorAll("button[data-theme-preference]").length'
          )
          text = text.replace(
              "await printPage.evaluate(() => window.dispatchEvent(new Event(\"beforeprint\")));\n  let printState",
              "let printState"
          )
          text = text.replace(
              'await printPage.evaluate(() => window.dispatchEvent(new Event("afterprint")));',
              'await printPage.emulateMedia({ media: "screen" });\n  await printPage.evaluate(() => window.dispatchEvent(new Event("afterprint")));'
          )
          path.write_text(text)
          PY
          rm .github/workflows/fix-theme-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Correct theme audit assertions"
          git push origin HEAD:feat/shared-dark-mode
