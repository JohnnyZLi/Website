name: Fix report grid mobile cascade retry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/report-open-grids' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/report-open-grids
      - name: Correct stacked grid specificity
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          css_path = Path('technical-report.css')
          css = css_path.read_text()
          pattern = re.compile(
              r'  \.report-grid article \{\n'
              r'    padding: 25px 0 28px;\n'
              r'    border-top: 0;\n'
              r'    border-right: 0;\n'
              r'  \}\n\n'
              r'  \.report-grid article \+ article \{\n'
              r'    border-top: 1px solid var\(--rule\);\n'
              r'  \}'
          )
          replacement = '''  .report-grid article {
            padding: 25px 0 28px;
            border-top: 0;
          }

          .report-grid article:nth-child(odd) {
            border-right: 0;
          }

          .report-grid article:nth-child(n + 3) {
            border-top: 0;
          }

          .report-grid article:nth-child(n + 2) {
            border-top: 1px solid var(--rule);
          }'''.replace('          ', '')
          css, count = pattern.subn(replacement, css, count=1)
          if count != 1:
              raise SystemExit(f'Expected one compact grid replacement, found {count}')
          css_path.write_text(css)

          validator_path = Path('scripts/validate-technical-report.mjs')
          validator = validator_path.read_text()
          validator, count = re.subn(
              r'  "\\.report-grid article \\+ article",',
              '  ".report-grid article:nth-child(n + 2)",',
              validator,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one validator fragment replacement, found {count}')
          validator_path.write_text(validator)
          PY
          rm -f .github/workflows/fix-report-grid-mobile-cascade.yml
          rm -f .github/workflows/fix-report-grid-mobile-cascade-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add technical-report.css scripts/validate-technical-report.mjs .github/workflows/fix-report-grid-mobile-cascade.yml .github/workflows/fix-report-grid-mobile-cascade-retry.yml
          git commit -m "Fix stacked report grid dividers"
          git push origin HEAD:fix/report-open-grids
