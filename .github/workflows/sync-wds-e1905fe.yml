name: Sync WDS e1905fe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'chore/sync-wds-e1905fe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Pin and sync shared design system
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sha = 'e1905fe7dea19ddd6bdfddc9cd24239c31aa41f9';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@johnnyzli/web-design-system'] = `github:JohnnyZLi/Web-Design-System#${sha}`;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          fs.writeFileSync('design-system.lock.json', JSON.stringify({package:'@johnnyzli/web-design-system',version:'1.9.0',sourceCommit:sha}, null, 2) + '\n');
          NODE
          npm install --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:integration
          rm .github/workflows/sync-wds-e1905fe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Web Design System e1905fe"
          npm run design-system:check
          git push
