name: One-time sync rounded open triggers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sync-rounded-open-triggers' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-rounded-open-triggers
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin merged design-system commit
        env:
          WDS_SOURCE_COMMIT: c98d5faf91789b8161bfcd49171797b593b0c726
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sha = os.environ['WDS_SOURCE_COMMIT']

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@johnnyzli/web-design-system'] = f'github:JohnnyZLi/Web-Design-System#{sha}'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          lock_path = Path('design-system.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sourceCommit'] = sha
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          source_path = Path('assets/design-system/SOURCE.md')
          text = source_path.read_text()
          text, count = re.subn(r'Source commit: [0-9a-f]+', f'Source commit: {sha}', text, count=1)
          if count != 1:
              raise SystemExit('Could not update Portfolio design-system source metadata')
          source_path.write_text(text)
          PY

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Sync and validate generated assets
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:sync
          git add package.json package-lock.json design-system.lock.json assets/design-system index.html projects site-switcher.js portfolio-navigation.js
          npm run design-system:check
          npm run design-system:integration

      - name: Commit generated sync only
        run: |
          git rm .github/workflows/one-time-sync-rounded-open-triggers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json design-system.lock.json assets/design-system index.html projects site-switcher.js portfolio-navigation.js
          git commit -m "Sync rounded open header triggers"
          git push origin HEAD:agent/sync-rounded-open-triggers
